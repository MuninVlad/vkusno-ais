<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12352a"/></marker></defs><rect x="1" y="1" width="1178" height="698" fill="white" stroke="#12352a"/><line x1="1" y1="670" x2="1179" y2="670" stroke="#12352a"/><line x1="140" y1="670" x2="140" y2="699" stroke="#12352a"/><line x1="1060" y1="670" x2="1060" y2="699" stroke="#12352a"/><text x="10" y="690" font-size="11" text-anchor="start" font-weight="bold" fill="#12352a">УЗЕЛ: A0</text><text x="150" y="690" font-size="11" text-anchor="start" font-weight="bold" fill="#12352a">НАЗВАНИЕ: Обслуживать гостей ресторана</text><text x="1070" y="690" font-size="11" text-anchor="start" font-weight="bold" fill="#12352a">НОМЕР: 2</text><rect x="150" y="120" width="200" height="100" fill="#fff4e3" stroke="#12352a" stroke-width="1.6"/><text x="250" y="162" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">Принять и</text><text x="250" y="178" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">оформить заказ</text><text x="344" y="214" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">A1</text><rect x="420" y="250" width="200" height="100" fill="#fff4e3" stroke="#12352a" stroke-width="1.6"/><text x="520" y="292" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">Приготовить</text><text x="520" y="308" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">заказ</text><text x="614" y="344" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">A2</text><rect x="690" y="380" width="200" height="100" fill="#fff4e3" stroke="#12352a" stroke-width="1.6"/><text x="790" y="422" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">Выдать заказ,</text><text x="790" y="438" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">начислить бонусы</text><text x="884" y="474" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">A3</text><rect x="900" y="120" width="200" height="100" fill="#fff4e3" stroke="#12352a" stroke-width="1.6"/><text x="1000" y="162" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">Анализировать</text><text x="1000" y="178" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">продажи</text><text x="1094" y="214" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">A4</text><polyline points="20,170 150,170" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="22" y="162" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Заказ гостя</text><polyline points="20,320 420,320" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="22" y="312" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Продукты</text><polyline points="350,190 380,190 380,285 420,285" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="358" y="182" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Заказ «новый»</text><polyline points="620,300 650,300 650,420 690,420" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="628" y="292" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Заказ «готов»</text><polyline points="890,430 1160,430" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="1160" y="422" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">Выданный заказ</text><polyline points="350,150 900,150" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="490" y="142" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Данные о продаже (чек)</text><polyline points="890,400 960,400 960,220" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="896" y="392" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Статус «выдан»</text><polyline points="1100,170 1160,170" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="1160" y="162" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">Отчёты</text><polyline points="1000,120 1000,70 300,70 300,120" fill="none" stroke="#c96d14" stroke-width="1.4" marker-end="url(#ar)" stroke-dasharray="5 4"/><text x="450" y="64" font-size="11" text-anchor="start" font-weight="normal" fill="#c96d14">Изменения меню и цен (обратная связь)</text><polyline points="210,40 210,120" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="216" y="52" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Меню и цены</text><polyline points="520,40 520,250" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="526" y="52" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Технологические карты</text><polyline points="790,40 790,380" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="796" y="52" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Правила программы</text><text x="796" y="66" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">лояльности</text><polyline points="1060,40 1060,120" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="1066" y="52" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Политика</text><text x="1066" y="66" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">безопасности</text><polyline points="250,640 250,220" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="256" y="632" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Кассир + АИС</text><polyline points="520,640 520,350