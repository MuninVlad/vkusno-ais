<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12352a"/></marker></defs><rect x="1" y="1" width="898" height="518" fill="white" stroke="#12352a"/><line x1="1" y1="490" x2="899" y2="490" stroke="#12352a"/><line x1="140" y1="490" x2="140" y2="519" stroke="#12352a"/><line x1="780" y1="490" x2="780" y2="519" stroke="#12352a"/><text x="10" y="510" font-size="11" text-anchor="start" font-weight="bold" fill="#12352a">УЗЕЛ: A-0</text><text x="150" y="510" font-size="11" text-anchor="start" font-weight="bold" fill="#12352a">НАЗВАНИЕ: Обслуживать гостей ресторана</text><text x="790" y="510" font-size="11" text-anchor="start" font-weight="bold" fill="#12352a">НОМЕР: 1</text><rect x="340" y="180" width="240" height="140" fill="#fff4e3" stroke="#12352a" stroke-width="1.6"/><text x="460" y="242" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">Обслуживать гостей</text><text x="460" y="258" font-size="13" text-anchor="middle" font-weight="bold" fill="#12352a">ресторана</text><text x="574" y="314" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">A0</text><polyline points="40,220 340,220" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="40" y="212" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Заказ гостя</text><polyline points="40,280 340,280" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="40" y="262" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Продукты и</text><text x="40" y="276" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">полуфабрикаты</text><polyline points="580,210 860,210" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="860" y="202" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">Выданный заказ</text><polyline points="580,250 860,250" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="860" y="242" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">Чек и данные о продаже</text><polyline points="580,290 860,290" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="860" y="282" font-size="11" text-anchor="end" font-weight="normal" fill="#12352a">Отчёты о продажах</text><polyline points="400,50 400,180" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="408" y="62" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Меню, цены,</text><text x="408" y="76" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">стандарты обслуживания</text><polyline points="520,50 520,180" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="528" y="62" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">152-ФЗ, политика</text><text x="528" y="76" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">безопасности</text><polyline points="400,460 400,320" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="408" y="430" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">Персонал</text><text x="408" y="444" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">ресторана</text><polyline points="520,460 520,320" fill="none" stroke="#12352a" stroke-width="1.4" marker-end="url(#ar)"/><text x="528" y="430" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">АИС «Вкусно</text><text x="528" y="444" font-size="11" text-anchor="start" font-weight="normal" fill="#12352a">и быстро»</text><text x="20" y="30" font-size="11" text-anchor="start" font-weight="normal" fill="#5d6b64">Цель: описать обслуживание гостей для автоматизации учёта.   Точка зрения: управляющий сетью.</text></svg>